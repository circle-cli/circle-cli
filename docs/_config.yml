# GitHub Pages (Jekyll) configuration for the circle-cli docs site.
#
# Publish settings: in the repository's Pages settings, choose
# "Deploy from a branch" and point it at this `/docs` folder. No GitHub
# Actions workflow is required — GitHub builds this Jekyll site for you.

title: Circle CLI
description: Command line tools for CircleCI, without leaving your terminal.
theme: jekyll-theme-cayman

# Root-relative for a custom domain or organization/user GitHub Pages site.
# If this is later published under a project path such as
# https://<org>.github.io/circle-cli, set this back to "/circle-cli".
baseurl: ""

# Keep the build lean and predictable.
markdown: kramdown
plugins:
  - jekyll-relative-links

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
